name: Build Electron (Windows)

on:
  workflow_dispatch:
  push:
    branches: [main, 'release/v*']
    paths:
      - 'packages/bruno-electron/**'
      - 'packages/bruno-app/**'
      - 'packages/bruno-common/**'
      - 'packages/bruno-js/**'
      - 'packages/bruno-converters/**'
      - 'packages/bruno-requests/**'
      - 'packages/bruno-schema-types/**'
      - 'packages/bruno-filestore/**'
      - 'packages/bruno-graphql-docs/**'
      - 'scripts/build-electron.sh'
      - '.github/workflows/build-electron-win.yml'

jobs:
  build-win:
    name: Build Windows Installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: v22.17.0
          cache: 'npm'
          cache-dependency-path: './package-lock.json'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build libraries
        run: |
          npm run build:graphql-docs
          npm run build:bruno-query
          npm run build:bruno-common
          npm run sandbox:bundle-libraries --workspace=packages/bruno-js
          npm run build:bruno-converters
          npm run build:bruno-requests
          npm run build:schema-types
          npm run build:bruno-filestore

      - name: Build web app
        run: npm run build:web

      - name: Build Windows installer
        run: npm run build:electron:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: bruno-windows-installer
          path: packages/bruno-electron/out/*.exe
          retention-days: 30
